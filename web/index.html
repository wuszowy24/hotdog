<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My hotdog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  color-scheme:light;
  --text:#33264A;--muted:#7A6E8E;--glass:rgba(255,255,255,.82);--glass2:rgba(255,255,255,.62);--line:rgba(51,38,74,.1);
  --track:rgba(51,38,74,.12);--bg:#F7D6BC;--card:#FFFFFF;--chip:#F6F1FA;
  --sh:0 10px 28px rgba(51,38,74,.18),0 2px 6px rgba(51,38,74,.08);
  --yellow:#FFC94A;--yellowD:#E5A51E;--pink:#FF8DB8;--pinkD:#E0608F;--blue:#6EC3F2;--blueD:#3D98CC;--green:#7DDA82;--greenD:#4EB357;--lilac:#B9A2F5;--lilacD:#8D72D9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--text:#F4EEFF;--muted:#BDB2D6;--glass:rgba(40,33,64,.82);--glass2:rgba(40,33,64,.62);--line:rgba(255,255,255,.1);--track:rgba(255,255,255,.14);--bg:#1F1A30;--card:#2B2542;--chip:#362E52}}
:root[data-theme="dark"]{color-scheme:dark;--text:#F4EEFF;--muted:#BDB2D6;--glass:rgba(40,33,64,.82);--glass2:rgba(40,33,64,.62);--line:rgba(255,255,255,.1);--track:rgba(255,255,255,.14);--bg:#1F1A30;--card:#2B2542;--chip:#362E52}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--sh);border-radius:22px}

#stage{position:fixed;inset:0;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);max-width:520px;margin:0 auto}
#ui .pe{pointer-events:auto}
.topwrap{display:flex;flex-direction:column;gap:8px}
.topbar{display:flex;align-items:center;gap:8px;padding:6px}
.ib{width:42px;height:42px;flex:none;border-radius:15px;background:var(--chip);display:grid;place-items:center;font-size:1.2rem;position:relative}
.ib:active{transform:scale(.94)}
.namebox{flex:1;min-width:0;text-align:center;line-height:1.08;display:flex;align-items:center;justify-content:center;gap:6px}
.namebox .sw{font-size:1.4rem;font-weight:800;color:var(--muted);width:26px}
.namebox .tx{min-width:0}
.namebox b{display:block;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namebox small{display:block;font-size:.74rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coins.pop{animation:cpop .45s ease-out}
@keyframes cpop{40%{transform:scale(1.15)}}
.float.sfx{font-size:1rem;text-shadow:0 1px 2px #fff,0 0 6px #fff}
.coins{display:flex;align-items:center;gap:6px;background:linear-gradient(#FFE58A,#FFC94A);color:#5A3A00;border-radius:15px;padding:0 12px;height:42px;font-weight:800;font-size:1.1rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#F7C948 45%,#E3A21A);box-shadow:inset 0 0 0 1.5px rgba(120,70,0,.35);vertical-align:-.12em;flex:none}
.sex{font-weight:800}.sex.m{color:#3D8BE0}.sex.f{color:#E0558E}
.stats{display:flex;align-items:center;gap:8px;padding:8px 10px}
.lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;flex:none;line-height:1}
.lvl b{font-size:1.25rem;font-weight:800}
.lvl small{font-size:.62rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lvl .xb{width:36px;height:5px;border-radius:3px;background:var(--track);margin-top:3px;overflow:hidden}
.lvl .xb i{display:block;height:100%;background:var(--lilac)}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.st .i{font-size:1.05rem;line-height:1.1}
.st .b{width:100%;height:8px;border-radius:5px;background:var(--track);overflow:hidden}
.st .b i{display:block;height:100%;border-radius:5px;transition:width .5s}
.st.low .i{animation:wob .8s ease-in-out infinite}
@keyframes wob{50%{transform:scale(1.25) rotate(-8deg)}}
.pagehead{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px;pointer-events:none}
.pagehead h1{margin:0;font-size:1.25rem;font-weight:800;text-align:center;color:#fff;text-shadow:0 2px 8px rgba(40,20,60,.45),0 1px 2px rgba(40,20,60,.4);line-height:1.1}
.dots{display:flex;gap:5px;justify-content:center;margin-top:3px}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.65);box-shadow:0 1px 3px rgba(40,20,60,.35);transition:width .25s}
.dots i.on{width:20px;background:#fff}
.pa{width:34px;height:34px;border-radius:50%;background:var(--glass2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:1.3rem;font-weight:800;color:var(--text);pointer-events:auto;box-shadow:0 3px 10px rgba(40,20,60,.15)}
.side{position:absolute;right:10px;top:46%;display:flex;flex-direction:column;gap:10px;transform:translateY(-50%)}
.side .ib{background:var(--glass);box-shadow:var(--sh);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);width:46px;height:46px;border-radius:16px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#FF5577;color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.badge.on{background:#4EB357}
#panel{padding:10px;min-height:76px;transition:transform .25s,opacity .25s}
#panel.swap{opacity:0;transform:translateY(12px)}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 6px;font-weight:800}
.ptitle small{font-weight:600;color:var(--muted);font-size:.8rem;text-align:right}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;touch-action:pan-x;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.strip::-webkit-scrollbar{display:none}
.it{flex:none;width:78px;border-radius:18px;background:var(--chip);padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;position:relative;touch-action:pan-x}
.it .em{font-size:1.9rem;line-height:1.15}
.it .nm{font-size:.68rem;font-weight:700;line-height:1.05;text-align:center;min-height:2.1em;display:flex;align-items:center}
.it .pr{font-size:.76rem;font-weight:800;display:flex;align-items:center;gap:3px;color:var(--muted)}
.it .cnt{position:absolute;top:-5px;right:-4px;background:#33264A;color:#fff;border-radius:10px;font-size:.68rem;font-weight:800;padding:0 6px}
.it.on{background:linear-gradient(#C7F2C4,#A8E6A4);color:#1F4A22}
.it.on .pr{color:#1F4A22}
.it.lock{opacity:.6}
.it:active{transform:scale(.95)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ab{flex:1;min-width:0;border-radius:18px;color:#33264A;font-weight:800;padding:8px 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:1rem;min-height:50px;
  background:linear-gradient(var(--c1),var(--c2));box-shadow:0 4px 0 var(--c3),0 6px 14px rgba(40,20,60,.15);--c1:#FFE17A;--c2:var(--yellow);--c3:var(--yellowD)}
.ab .em{font-size:1.35rem}
.ab:disabled{filter:grayscale(.7);opacity:.55}
.ab:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--c3)}
.ab.b{--c1:#9BD9FA;--c2:var(--blue);--c3:var(--blueD)}.ab.g{--c1:#A6EBAA;--c2:var(--green);--c3:var(--greenD)}.ab.p{--c1:#FFB3D1;--c2:var(--pink);--c3:var(--pinkD)}.ab.l{--c1:#D3C4FA;--c2:var(--lilac);--c3:var(--lilacD)}
.ab.w{--c1:var(--chip);--c2:var(--chip);--c3:var(--track);color:var(--text)}
.trk{flex:1 1 22%;flex-direction:column;gap:0;padding:5px 4px 7px;min-height:60px;font-size:.82rem;--c1:var(--chip);--c2:var(--chip);--c3:var(--track);color:var(--text)}
.trk .em{font-size:1.3rem}
.trk .mb{width:84%;height:5px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:3px}
.trk .mb i{display:block;height:100%;background:var(--lilac)}
.trk.lock{opacity:.55}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{border-radius:20px;padding:10px 10px 9px;text-align:left;color:#fff;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 0 rgba(0,0,0,.18),0 8px 18px rgba(40,20,60,.2);position:relative;overflow:hidden}
.gc .em{font-size:1.8rem;line-height:1}
.gc b{font-size:1.02rem;line-height:1.05;display:block}
.gc small{font-size:.7rem;opacity:.9;font-weight:600}
.gc:active{transform:translateY(3px)}
.gc.g1{background:linear-gradient(135deg,#6FD38A,#2FA35B)}.gc.g2{background:linear-gradient(135deg,#F7B551,#E0732E)}.gc.g3{background:linear-gradient(135deg,#7CC6F0,#4E73D9)}.gc.g4{background:linear-gradient(135deg,#F59BBE,#B66BD8)}
.gc .tag3d{position:absolute;top:8px;right:8px;font-size:.62rem;font-weight:800;background:rgba(255,255,255,.28);border-radius:8px;padding:0 6px}
.prog{height:10px;border-radius:6px;background:var(--track);overflow:hidden;margin:2px 4px 8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#9BD9FA,#3D98CC);width:0;transition:width .2s}
.hint{font-size:.85rem;color:var(--muted);font-weight:600;margin:0 4px 8px;line-height:1.25}

#fx{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.float{position:absolute;font-weight:800;font-size:1.5rem;animation:floatUp 1.2s ease-out forwards;white-space:nowrap;color:#fff;text-shadow:0 2px 6px rgba(40,20,60,.5);transform:translate(-50%,-50%)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-50%) scale(.8)}20%{transform:translate(-50%,-70%) scale(1.15)}to{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.need{position:absolute;background:#fff;border-radius:16px;padding:0 9px;font-size:1.45rem;box-shadow:var(--sh);transform:translate(-50%,-100%);animation:bob 1.6s ease-in-out infinite}
.need::after{content:"";position:absolute;left:12px;bottom:-6px;width:12px;height:12px;background:#fff;transform:rotate(45deg);border-radius:2px}
@keyframes bob{50%{margin-top:-5px}}
.shower{position:absolute;width:150px;height:260px;transform:translate(-50%,-100%);background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(79,179,234,.6) 10px 13px);background-size:100% 40px;animation:rain .3s linear infinite;border-radius:40px 40px 0 0;opacity:.85}
@keyframes rain{from{background-position:0 0}to{background-position:0 40px}}
.away{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px;padding:8px 16px;font-weight:700;box-shadow:var(--sh);z-index:4;text-align:center;pointer-events:none}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translateX(-50%);background:rgba(40,28,62,.92);color:#fff;border-radius:16px;padding:8px 16px;font-weight:600;z-index:90;max-width:min(90vw,440px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

.sheetwrap{position:fixed;inset:0;background:rgba(20,14,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--card);color:var(--text);border-radius:28px 28px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;-webkit-user-select:text;user-select:text;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.shead h2{margin:0;font-size:1.45rem;font-weight:800}
.btn{background:linear-gradient(#FFE17A,var(--yellow));color:#33264A;border-radius:16px;box-shadow:0 4px 0 var(--yellowD);padding:9px 16px;font-weight:800;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--yellowD)}
.btn:disabled{filter:grayscale(.6);opacity:.5}
.btn.big{width:100%;padding:13px 18px;font-size:1.15rem}
.btn.sm{padding:5px 12px;font-size:.9rem;border-radius:12px;box-shadow:0 3px 0 var(--yellowD)}
.btn.ghost{background:var(--chip);color:var(--text);box-shadow:0 3px 0 var(--track)}
.btn.love{background:linear-gradient(#FFB3D1,var(--pink));box-shadow:0 4px 0 var(--pinkD)}
.btn.ok{background:linear-gradient(#A6EBAA,var(--green));box-shadow:0 3px 0 var(--greenD)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.info b{font-weight:700}
.info small{color:var(--muted);font-weight:500}
.group{margin:12px 0 2px;font-weight:800;font-size:1.05rem}
.note{margin:4px 0;color:var(--muted);font-weight:500;line-height:1.35}
.thumb{width:96px;height:76px;flex:none;object-fit:contain;background:var(--chip);border-radius:14px}
.setrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.setrow input{flex:1}
input[type=text]{font:inherit;font-weight:600;font-size:1.05rem;padding:9px 12px;border-radius:14px;border:2px solid var(--line);background:var(--chip);color:var(--text);min-width:0;width:100%}
.roomcode{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(#FFF4CC,#FFE7A0);color:#33264A;border-radius:18px;padding:8px 14px;font-weight:700}
.roomcode b{font-size:1.8rem;letter-spacing:.12em;font-weight:800}
.online{display:inline-block;width:10px;height:10px;border-radius:50%;background:#B9AED0;margin-right:5px;vertical-align:1px}
.online.on{background:#4EB357}
.loveh{font-size:1.4rem;letter-spacing:.1em;margin:4px 0}
.qbar{height:8px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:4px}
.qbar i{display:block;height:100%;background:var(--green)}
.rb{width:42px;height:42px;flex:none;border-radius:15px;background:var(--chip);color:var(--text);display:grid;place-items:center;font-size:1.05rem;font-weight:800}

#game{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
#game .gtop{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
#game .gtop>*{pointer-events:auto}
#game .gtop h2{margin:0;font-size:1.2rem;font-weight:800;flex:1;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4)}
#game .gtop .rb{background:var(--glass);box-shadow:var(--sh)}
.gbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.gfull{position:absolute;inset:0}
.gfull canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ghud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 60px);display:flex;justify-content:center;gap:8px;z-index:5;pointer-events:none}
.ghud .gp{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:3px 12px;font-weight:800;display:flex;align-items:center;gap:6px;box-shadow:var(--sh);color:var(--text)}
.gmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:28px;background:rgba(30,20,50,.45);color:#fff;z-index:7;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.gmsg b{font-size:1.7rem;font-weight:800}
.gmsg span{max-width:30ch;font-weight:600;line-height:1.35}
.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,14,35,.45);z-index:8;padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.rcard{background:var(--card);color:var(--text);border-radius:26px;padding:20px;width:min(100%,340px);text-align:center;box-shadow:var(--sh);animation:up .25s ease-out}
.rcard h3{margin:0 0 6px;font-size:1.55rem;font-weight:800}
.rcard p{margin:4px 0;font-weight:600}
.rcard .big-coins{font-size:2.1rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}
.rcard .btn{margin-top:12px}
.rcard img{width:80%;max-width:240px}
#invite{position:fixed;inset:0;z-index:70}
#invite .result{position:fixed}
.joy{position:absolute;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);z-index:5;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.gbtn{position:absolute;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 42px);width:96px;height:96px;border-radius:50%;z-index:5;font-weight:800;font-size:1.05rem;color:#33264A;background:linear-gradient(#FFE17A,var(--yellow));box-shadow:0 5px 0 var(--yellowD),0 8px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.gbtn .em{font-size:2rem}
.gbtn:disabled{filter:grayscale(.8);opacity:.6}
.sniff{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);transform:translateX(-50%);z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;padding:4px 14px;font-weight:800;box-shadow:var(--sh);color:var(--text);text-align:center;min-width:110px}
.sniff .sb{height:7px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:2px}
.sniff .sb i{display:block;height:100%;background:linear-gradient(90deg,#6EC3F2,#FFC94A,#FF5577)}
.mwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 70px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);background:linear-gradient(#B9A2F5,#F59BBE)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
.mhud{display:flex;justify-content:center;gap:10px;margin-bottom:14px;color:#fff;font-weight:800;font-size:1.1rem}
.card{position:relative;aspect-ratio:1/1.05;border-radius:18px;font-size:clamp(28px,10vw,44px);perspective:600px;box-shadow:0 4px 0 rgba(0,0,0,.15),0 6px 14px rgba(40,20,60,.2)}
.card .front,.card .back{position:absolute;inset:0;display:grid;place-items:center;border-radius:18px;backface-visibility:hidden;transition:transform .3s}
.card .front{background:#FFF8EC;transform:rotateY(180deg)}
.card .back{background:linear-gradient(135deg,#FFFFFF,#EDE3FF);color:#8D72D9}
.card.up .front{transform:rotateY(0)}
.card.up .back{transform:rotateY(-180deg)}
.card.done .front{background:#D9F7D6}
.fxwrap{position:relative;flex:1;min-height:260px;overflow:hidden}
.fxwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hz{position:absolute;inset:0;pointer-events:none}

<script>
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const KEY='my_hotdog_v2',OLDKEY='moj_jamnik_v1';
const CFG=window.MYHOTDOG_CONFIG||{};

/* ---- Ustawienia gry ---- */
const GROW_H={young:24,adult:72};       // godziny: szczeniak -> młody -> dorosły

  {id:'col_blue',slot:'neck',n:'Niebieska obroża',e:'🔵',price:25,c:'#3D8BE0'},

  {id:'sweater',slot:'body',n:'Sweterek w paski',e:'🧶',price:100},
  {id:'raincoat',slot:'body',n:'Żółty płaszczyk',e:'🧥',price:90}
];
const SLOTS={neck:'Obroże',head:'Na głowę',face:'Na oczy',body:'Ubranka'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt<0?0:255,p=Math.abs(amt);
  r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ================= Mini3D – mały silnik 3D (WebGL1) ================= */
const V3={
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]},
  len:a=>Math.hypot(a[0],a[1],a[2])
};
const M4={
  ident(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m},
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3]}return o},
  persp(fovy,asp,n,f){const t=1/Math.tan(fovy/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m},
  lookAt(e,c,up){const z=V3.norm(V3.sub(e,c)),x=V3.norm(V3.cross(up,z)),y=V3.cross(z,x),m=new Float32Array(16);
    m[0]=x[0];m[4]=x[1];m[8]=x[2];m[1]=y[0];m[5]=y[1];m[9]=y[2];m[2]=z[0];m[6]=z[1];m[10]=z[2];
    m[12]=-V3.dot(x,e);m[13]=-V3.dot(y,e);m[14]=-V3.dot(z,e);m[15]=1;return m},
  compose(p,r,s,out){
    const cx=Math.cos(r[0]),sx=Math.sin(r[0]),cy=Math.cos(r[1]),sy=Math.sin(r[1]),cz=Math.cos(r[2]),sz=Math.sin(r[2]);
    const m=out||new Float32Array(16);
    m[0]=(cy*cz+sy*sx*sz)*s[0];m[1]=(cx*sz)*s[0];m[2]=(-sy*cz+cy*sx*sz)*s[0];
    m[4]=(-cy*sz+sy*sx*cz)*s[1];m[5]=(cx*cz)*s[1];m[6]=(sy*sz+cy*sx*cz)*s[1];
    m[8]=(sy*cx)*s[2];m[9]=(-sx)*s[2];m[10]=(cy*cx)*s[2];
    m[3]=0;m[7]=0;m[11]=0;m[12]=p[0];m[13]=p[1];m[14]=p[2];m[15]=1;return m},
  mulTo(o,a,b){for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];for(let r=0;r<4;r++)o[c*4+r]=a[r]*b0+a[4+r]*b1+a[8+r]*b2+a[12+r]*b3}return o},
  invert(a){
    const o=new Float32Array(16);
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,
      b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!det)return M4.ident();det=1/det;
    o[0]=(a11*b11-a12*b10+a13*b09)*det;o[1]=(a02*b10-a01*b11-a03*b09)*det;o[2]=(a31*b05-a32*b04+a33*b03)*det;o[3]=(a22*b04-a21*b05-a23*b03)*det;
    o[4]=(a12*b08-a10*b11-a13*b07)*det;o[5]=(a00*b11-a02*b08+a03*b07)*det;o[6]=(a32*b02-a30*b05-a33*b01)*det;o[7]=(a20*b05-a22*b02+a23*b01)*det;
    o[8]=(a10*b10-a11*b08+a13*b06)*det;o[9]=(a01*b08-a00*b10-a03*b06)*det;o[10]=(a30*b04-a31*b02+a33*b00)*det;o[11]=(a21*b02-a20*b04-a23*b00)*det;
    o[12]=(a11*b07-a10*b09-a12*b06)*det;o[13]=(a00*b09-a01*b07+a02*b06)*det;o[14]=(a31*b01-a30*b03-a32*b00)*det;o[15]=(a20*b03-a21*b01+a22*b00)*det;
    return o},
  xf(m,p){const w=m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15]||1;return[(m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12])/w,(m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13])/w,(m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14])/w]},
  xd(m,d){return[m[0]*d[0]+m[4]*d[1]+m[8]*d[2],m[1]*d[0]+m[5]*d[1]+m[9]*d[2],m[2]*d[0]+m[6]*d[1]+m[10]*d[2]]},
  nmat(m){
    const a=m[0],b=m[1],c=m[2],d=m[4],e=m[5],f=m[6],g=m[8],h=m[9],i=m[10];
    const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g;let det=a*A+b*B+c*C;det=det?1/det:0;
    const o=new Float32Array(9);
    o[0]=A*det;o[1]=B*det;o[2]=C*det;
    o[3]=-(b*i-c*h)*det;o[4]=(a*i-c*g)*det;o[5]=-(a*h-b*g)*det;
    o[6]=(b*f-c*e)*det;o[7]=-(a*f-c*d)*det;o[8]=(a*e-b*d)*det;
    return o}
};
const hex3=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)/255,((n>>8)&255)/255,(n&255)/255]};

/* ---- geometry (shared, cached by key) ---- */
const GEOS=new Map();
function G(key,fn){let g=GEOS.get(key);if(!g){g=fn();g.key=key;GEOS.set(key,g)}return g}
function sphereRaw(ws,hs){
  const p=[],n=[],idx=[];
  for(let iy=0;iy<=hs;iy++){const v=iy/hs,th=v*Math.PI;for(let ix=0;ix<=ws;ix++){const ph=ix/ws*Math.PI*2+Math.PI/ws;
    const x=-Math.cos(ph)*Math.sin(th),y=Math.cos(th),z=Math.sin(ph)*Math.sin(th);p.push(x,y,z);n.push(x,y,z)}}
  for(let iy=0;iy<hs;iy++)for(let ix=0;ix<ws;ix++){const a=iy*(ws+1)+ix,b=a+ws+1;if(iy!==0)idx.push(a,b,a+1);if(iy!==hs-1)idx.push(a+1,b,b+1)}
  return{p,n,idx};
}
const geoSphere=()=>G('sph',()=>{const s=sphereRaw(28,17);return{p:new Float32Array(s.p),n:new Float32Array(s.n),i:new Uint16Array(s.idx)}});
// capsule along X: radius r, distance between sphere centers L, taper = radius factor at -X end
function geoCapsule(r,L,taper){taper=taper==null?1:taper;return G(`cap${r.toFixed(3)}_${L.toFixed(3)}_${taper}`,()=>{
  const s=sphereRaw(24,15),h=L/2;
  for(let k=0;k<s.p.length;k+=3){const x=s.p[k],sgn=x>0?1:-1;const cx=sgn*h;const f=taper===1?1:(taper+(1-taper)*((cx+h)/(L||1)));
    s.p[k]=x*r*f+cx;s.p[k+1]*=r*f;s.p[k+2]*=r*f}
  return{p:new Float32Array(s.p),n:new Float32Array(s.n),i:new Uint16Array(s.idx)}})}
function geoRBox(hx,hy,hz,r){return G(`rb${hx}_${hy}_${hz}_${r}`,()=>{
  const H=[hx,hy,hz],I=[hx-r,hy-r,hz-r],p=[],n=[],idx=[];
  const samp=a=>{const h=H[a],i=I[a],o=[-h,-(i+(h-i)*.55),-i];const m=4;for(let k=1;k<m;k++)o.push(-i+2*i*k/m);o.push(i,i+(h-i)*.55,h);return o};
  const S=[samp(0),samp(1),samp(2)];
  for(let ax=0;ax<3;ax++)for(const sg of[-1,1]){
    const u=(ax+1)%3,v=(ax+2)%3,su=S[u],sv=S[v],base=p.length/3;
    for(let j=0;j<sv.length;j++)for(let i=0;i<su.length;i++){
      const q=[0,0,0];q[ax]=sg*H[ax];q[u]=su[i];q[v]=sv[j];
      const c=[clampN(q[0],I[0]),clampN(q[1],I[1]),clampN(q[2],I[2])];
      let d=[q[0]-c[0],q[1]-c[1],q[2]-c[2]];const l=Math.hypot(d[0],d[1],d[2]);
      d=l>1e-6?[d[0]/l,d[1]/l,d[2]/l]:(()=>{const z=[0,0,0];z[ax]=sg;return z})();
      p.push(c[0]+d[0]*r,c[1]+d[1]*r,c[2]+d[2]*r);n.push(d[0],d[1],d[2]);
    }
    const W=su.length;
    for(let j=0;j<sv.length-1;j++)for(let i=0;i<W-1;i++){const a=base+j*W+i,b=a+W;
      if(sg>0)idx.push(a,a+1,b,a+1,b+1,b);else idx.push(a,b,a+1,a+1,b,b+1)}
  }
  return{p:new Float32Array(p),n:new Float32Array(n),i:new Uint16Array(idx)}})}
const clampN=(v,i)=>Math.max(-i,Math.min(i,v));
function geoTorus(R,r){return G(`to${R}_${r}`,()=>{
  const p=[],n=[],idx=[],S=36,T=12;
  for(let i=0;i<=S;i++){const u=i/S*Math.PI*2;for(let j=0;j<=T;j++){const v=j/T*Math.PI*2;
    const nx=Math.cos(u)*Math.cos(v),ny=Math.sin(v),nz=Math.sin(u)*Math.cos(v);
    p.push(Math.cos(u)*R+nx*r,ny*r,Math.sin(u)*R+nz*r);n.push(nx,ny,nz)}}
  for(let i=0;i<S;i++)for(let j=0;j<T;j++){const a=i*(T+1)+j,b=a+T+1;idx.push(a,a+1,b,a+1,b+1,b)}
  return{p:new Float32Array(p),n:new Float32Array(n),i:new Uint16Array(idx)}})}
// lathe around Y from profile [[radius,y],...]
function geoLathe(key,prof){return G('la'+key,()=>{
  const p=[],n=[],idx=[],S=28,P=prof.length;
  for(let i=0;i<=S;i++){const u=i/S*Math.PI*2,c=Math.cos(u),s=Math.sin(u);
    for(let j=0;j<P;j++){const[r,y]=prof[j];const a=prof[Math.max(0,j-1)],b=prof[Math.min(P-1,j+1)];
      let dr=b[0]-a[0],dy=b[1]-a[1];let nx=dy,ny=-dr;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
      p.push(r*c,y,r*s);n.push(nx*c,ny,nx*s)}}
  for(let i=0;i<S;i++)for(let j=0;j<P-1;j++){const a=i*P+j,b=a+P;idx.push(a,a+1,b,a+1,b+1,b)}
  return{p:new Float32Array(p),n:new Float32Array(n),i:new Uint16Array(idx)}})}

/* ---- scene graph ---- */
class Node{
  constructor(geo,mat){this.p=[0,0,0];this.r=[0,0,0];this.s=[1,1,1];this.kids=[];this.geo=geo||null;this.mat=mat||null;this.visible=true;this.world=M4.ident();this.parent=null}
  add(...ns){for(const n of ns){n.parent=this;this.kids.push(n)}return ns[0]}
  remove(n){const i=this.kids.indexOf(n);if(i>=0)this.kids.splice(i,1);n.parent=null}
  at(x,y,z){this.p=[x,y,z];return this}
  rot(x,y,z){this.r=[x,y,z];return this}
  sc(x,y,z){this.s=[x,y==null?x:y,z==null?x:z];return this}

function loop(ts){

  const lo=Math.floor(M.off+.001),hi=Math.ceil(M.off-.001);M.rooms.forEach((r,i)=>r.visible=i>=lo&&i<=hi);

  dog.setDirt(clamp((65-st.clean)/65,0,1)*(M.rinsing>0?Math.max(0,M.rinsing-.3):1));

function moveDog(dt,d){
  const A=M.dog.A;
  const busy=d.sleeping||A.eat>0||A.trick||M.foam>0||M.rinsing>0||M.rot||M.potty;
  let tgt=null,maxV=1.15;
  if(M.fetch){tgt=M.fetch.goal;maxV=3.4}else if(M.target){tgt=M.target.p;maxV=M.target.v||(M.runFast?3.8:1.15)}
  if(stage(d)==='pup')maxV*=.75;
  if(tgt&&!busy){
    if(A.act&&!['sniff'].includes(A.act))A.act=null;
    const dx=tgt[0]-M.pos[0],dz=tgt[2]-M.pos[2],dist=Math.hypot(dx,dz);
    if(M.target&&!M.fetch){M.target.t=(M.target.t||0)+dt}
    if(dist>.07&&!(M.target&&!M.fetch&&M.target.t>9)){
      M.onSpot=false;
      const want=Math.atan2(-dz,dx);let diff=((want-M.yaw+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
      const turn=(M.vel>2.5?2.6:4.2)*dt;M.yaw+=clamp(diff,-turn,turn);
      let desired=dist<.7?maxV*Math.max(.25,dist/.7):maxV;if(Math.abs(diff)>1.1)desired*=.25;
      M.vel+=clamp(desired-M.vel,-7*dt,4.5*dt);
      M.pos[0]+=Math.cos(M.yaw)*M.vel*dt;M.pos[2]-=Math.sin(M.yaw)*M.vel*dt;avoid();
      A.move=Math.max(M.vel,Math.abs(diff)>.3?.45:0);return;
    }
    M.vel=0;A.move=0;M.runFast=false;
    if(M.fetch){fetchArrive();return}
    if(M.target){const cb=M.target.cb;M.target=null;M.idle=4+Math.random()*4;if(cb)cb()}
  }else{
    M.vel=Math.max(0,M.vel-8*dt);
    if(!busy&&!M.fetch){
      const face=-.55+Math.sin(M.t*.35)*.1;let diff=((face-M.yaw+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
      if(!A.act||A.act==='lookcam'||A.act==='wag'){M.yaw+=clamp(diff,-1.6*dt,1.6*dt);A.move=Math.abs(diff)>.25&&!A.act?.4:0}else A.move=0;
      idleBrain(dt,d);
    }else A.move=0;
  }
}
const IDLE_ACTS=[['sniff',2.6,3],['scratch',2.2,1],['stretch',1.9,1],['yawn',1.6,1],['lookcam',2.4,2],['sit',4.5,2],['lie',6,1],['wag',2,2]];
function idleBrain(dt,d){
  const A=M.dog.A;
  const R=ROOMS[M.dogPage],st=cur(d);
  if(R.id==='garden'&&st.potty>=35&&!M.potty&&!M.pottyGo&&M.dogPage===M.page){A.act=null;M.actT=0;startPotty();return}
  if(M.actT>0){M.actT-=dt;if(M.actT<=0){A.act=null;M.idle=1.5+Math.random()*2.5}return}
  M.idle-=dt;if(M.idle>0||M.dogPage!==M.page)return;
  const r=Math.random();
  if(R.wander&&r<.42){M.target={p:freeSpot(M.dogPage),cb:()=>{M.onSpot=Math.hypot(M.pos[0]-spotOf(M.dogPage)[0],M.pos[2]-spotOf(M.dogPage)[2])<.2}};return}
  const pool=[];for(const[a,dur,w]of IDLE_ACTS){let ww=w;if(a==='yawn'&&st.energy<40)ww+=3;if(a==='lie'&&st.energy<45)ww+=3;if((a==='lie'||a==='sit')&&['bath'].includes(R.id))ww=0;if(a==='sniff'&&R.id==='garden')ww+=3;for(let i=0;i<ww;i++)pool.push([a,dur])}
  const[a,dur]=pool[Math.random()*pool.length|0];A.act=a;M.actT=dur+Math.random()*1.5;if(a==='wag'||a==='lookcam')A.wag=dur;
  if(a==='yawn')setTimeout(()=>sfx('yip'),500);
}

function startPotty(){

  if(M.pottyGo)return;M.pottyGo=true;A.act=null;M.actT=0;
  const rx=roomX(4);
  const spot=male?[rx+(Math.random()<.5?-1.4:1.6),0,-2.05]:[rx+(Math.random()-.5)*2.4,0,-.4+Math.random()*.8];
  const doPoop=st.potty>60||Math.random()<.45;
  M.target={p:spot,v:1.3,cb:()=>{
    M.pottyGo=false;if(M.dogPage!==4)return;M.potty=true;
    if(male)M.yaw=Math.PI/2+(Math.random()<.5?.4:-.4);
    A.act='sniff';
    setTimeout(()=>{if(!M.potty)return;A.act=male?'pee_m':'squat';peeStart(male);
      setTimeout(()=>{peeStop();
        const next=()=>{A.act='kick';kickGrass();setTimeout(()=>{A.act=null;M.potty=false;M.idle=3;
          const d2=D();bump(d2,{potty:-100,fun:5});quest('potty');S.coins+=1;sfx('coin');
          const h=M.anchors.head;if(h)floatAt(Gx(d2,'Dobry pies! +1','Grzeczna suczka! +1'),h[0],h[1]-30);renderHUD();renderPanel()},1300)};
        if(doPoop){A.act='poop';setTimeout(()=>{addMess(4,'poop',M.dog.tailWorld());next()},2200)}else next();
      },2600)},1400);
  }};
}

function setupInput(){
  const cv=$('#stage');let st=null;
  cv.addEventListener('pointerdown',e=>{
    if(!S||!M.dog)return;
    const x=e.clientX,y=e.clientY,ray=M.eng.ray(M.cam,x,y),mg=pickMess(ray);if(mg){cleanMess(mg,x,y);st=null;return}
    const hit=dogHere()?pickRay(ray,M.dog.pick):null;
    const id=R0().id;
    st={x,y,hit:!!hit,mode:null,t:performance.now(),lastFoam:null,startOff:M.off,lx:x};
    if(hit&&id==='bath'&&!D().sleeping){st.mode='rub';rub(hit,st)}
    else if(hit&&id==='wardrobe'){st.mode='rot'}
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
  });
  cv.addEventListener('pointermove',e=>{
    if(!st)return;const x=e.clientX,y=e.clientY,dx=x-st.x,dy=y-st.y;
    if(st.mode==='rub'){const hit=pickRay(M.eng.ray(M.cam,x,y),M.dog.pick);if(hit)rub(hit,st);return}
    if(st.mode==='rot'){if(Math.abs(dx)>6){M.rot=true;M.yaw+=(x-st.lx)*.013;st.lx=x}return}
    if(!st.mode&&Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){st.mode='swipe';M.dragging=true}
    if(st.mode==='swipe'){M.off=clamp(st.startOff-dx/window.innerWidth,-.25,ROOMS.length-.75)}
  });
  const end=e=>{
    if(!st)return;const x=e.clientX,y=e.clientY,dx=x-st.x,dy=y-st.y,dtm=performance.now()-st.t;
    if(st.mode==='swipe'){M.dragging=false;const v=dx/Math.max(1,dtm);let p=Math.round(M.off);
      if(Math.abs(v)>.45)p=st.startOff-Math.sign(dx);goPage(Math.round(clamp(p,0,ROOMS.length-1)))}
    else if(st.mode==='rot'){setTimeout(()=>M.rot=false,600);if(Math.hypot(dx,dy)<8)pet(x,y)}
    else if(!st.mode&&Math.hypot(dx,dy)<10){
      if(st.hit)pet(x,y);
      else if(R0().id==='garden')throwBall();
    }
    st=null;
  };
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',()=>{if(st&&st.mode==='swipe'){M.dragging=false;goPage(Math.round(M.off))}st=null});
}

function throwBall(){
  const d=D();

  if(M.dogPage!==4){toast('Poczekaj, aż pies dobiegnie do ogrodu.');return}
  if(M.fetch||M.ball||M.potty)return;
  if(cur(d).energy<5){toast(`${esc(d.name)} ${Gx(d,'jest zbyt zmęczony','jest zbyt zmęczona')}.`);return}
  const gx=roomX(4)+(Math.random()-.5)*4.6,gz=-1.6+Math.random()*1.8;
  const ball=new Node(geoSphere(),mat('#E04848',.02,{pat:6,pc:hex3('#FFFFFF'),ps:4}));ball.s=[.18,.18,.18];
  M.scene.add(ball);M.ball={node:ball,from:[roomX(4),2,4],to:[gx,.18,gz],t:0,dur:.8,state:'fly'};
  const deco=M.rooms[4].decoBall;if(deco)deco.visible=false;

function updateBall(dt){

    b.node.p=[b.from[0]+(b.to[0]-b.from[0])*k,b.from[1]+(b.to[1]-b.from[1])*k+Math.sin(Math.PI*k)*2,b.from[2]+(b.to[2]-b.from[2])*k];
    b.node.r=[k*9,0,k*6];if(k>=1){b.state='rest';sfx('pop')}}

    M.ball.node.p=[M.pos[0]+1.2*M.dog.P.k*Math.cos(M.yaw),.18,M.pos[2]-1.2*M.dog.P.k*Math.sin(M.yaw)];M.ball.state='done';

function doTrick(id){
  const d=D(),T=TRICKS.find(t=>t.id===id),A=M.dog.A;
  if(d.sleeping){sleepBlock();return}
  if(level()<T.lvl){toast(`${T.n} odblokuje się na poziomie więzi ${T.lvl}.`);return}
  if(!dogHere()||M.dogPage!==M.page||!M.dog){toast('Poczekaj, aż pies przybiegnie.');return}
  if(M.potty||M.pottyGo){toast(`${esc(d.name)} załatwia swoje sprawy. Chwilkę!`);return}
  if(A.trick||A.eat>0)return;
  if(M.fetch){toast('Najpierw niech przyniesie piłkę.');return}
  if(cur(d).energy<4){toast(`${esc(d.name)} ${Gx(d,'jest zbyt zmęczony','jest zbyt zmęczona')}.`);return}
  M.target=null;M.vel=0;
  d.tricks=d.tricks||{};const lv=d.tricks[id]||0;
  const chance=Math.min(1,.55+lv*.006-(stage(d)==='pup'?.1:0));
  M.target=null;A.act=null;M.actT=0;
  if(Math.random()<chance){
    A.trick={name:id,t:0,dur:T.dur};d.tricks[id]=Math.min(100,lv+12);
    const coins=lv>=100?3:1;S.coins+=coins;bump(d,{fun:4,energy:-2});addXP(3);quest('trick');
    setTimeout(()=>{const h=M.anchors.head;if(h)floatAt(lv<100&&lv+12>=100?'Mistrz! 🏆':'Brawo! +'+coins,h[0],h[1]-30);sfx('coin')},T.dur*500);
    if(lv<100&&lv+12>=100)setTimeout(()=>toast(`${esc(d.name)} ${Gx(d,'opanował','opanowała')} sztuczkę ${T.n}! Teraz daje 3 monety.`),1200);
  }else{
    A.trick={name:'huh',t:0,dur:1.3};d.tricks[id]=Math.min(100,lv+8);bump(d,{energy:-1});
    const h=M.anchors.head;if(h)floatAt('?',h[0]+10,h[1]-30);toast(`${esc(d.name)} jeszcze nie ${Gx(d,'zrozumiał','zrozumiała')}. Ćwicz dalej, nauka: ${Math.min(100,lv+8)}%`);
  }
  touch(d);renderPanel();renderHUD();
}

const FX={eng:null,canvas:null,scene:null,dogs:[],cam:null,run:null,last:0};
function fxMount(container,scene,cam,run){
  if(!FX.eng){FX.canvas=document.createElement('canvas');FX.eng=new Engine(FX.canvas,{fixed:true,alpha:true});requestAnimationFrame(fxLoop)}
  container.appendChild(FX.canvas);FX.scene=scene;FX.cam=cam;FX.run=run;FX.container=container;
}
function fxStop(){FX.run=null;FX.scene=null;if(FX.canvas&&FX.canvas.parentNode)FX.canvas.parentNode.removeChild(FX.canvas)}
function fxLoop(ts){
  requestAnimationFrame(fxLoop);const dt=Math.min(.05,(ts-FX.last)/1000||0);FX.last=ts;
  if(!FX.scene||!FX.container||!FX.container.isConnected)return;
  const r=FX.container.getBoundingClientRect();FX.eng.size(r.width,r.height);

}

/* ================= Sieć: Firebase Realtime Database ================= */
const NET={
  base:null,
  cands(){const c=CFG.firebaseUrl;return(Array.isArray(c)?c:[c]).filter(u=>typeof u==='string'&&/^https?:\/\/[^/]+/.test(u)).map(u=>u.replace(/\/+$/,''))},
  ok(){return this.cands().length>0},
  async init(){
    if(this.base)return this.base;const cs=this.cands();
    if(cs.length===1){this.base=cs[0];return this.base}
    let saved=null;try{saved=localStorage.getItem('hotdog_db')}catch(e){}
    if(saved&&cs.includes(saved)){this.base=saved;return saved}
    for(const u of cs){try{const r=await fetch(u+'/rooms/PROBE1.json',{cache:'no-store'});if(r.ok){this.base=u;try{localStorage.setItem('hotdog_db',u)}catch(e){}return u}}catch(e){}}
    throw new Error('Nie mogę połączyć się z bazą Firebase.');
  },
  u(p){return(this.base||this.cands()[0])+'/'+p+'.json'},
  async req(m,p,v){await this.init();const r=await fetch(this.u(p),{method:m,headers:{'Content-Type':'application/json'},body:v===undefined?undefined:JSON.stringify(v)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()},
  get(p){return this.req('GET',p)},put(p,v){return this.req('PUT',p,v)},patch(p,v){return this.req('PATCH',p,v)},del(p){return this.req('DELETE',p)}
};
let ROOM=null;const askedSeen=new Set();
function partner(){if(!ROOM)return null;const pl=ROOM.data.players||{};for(const pid in pl)if(pid!==S.pid&&pl[pid])return Object.assign({pid},pl[pid]);return null}
const isOnline=p=>p&&Date.now()-(p.at||0)<75000;
function profile(d){return{id:d.id,name:d.name,sex:d.sex||'m',coat:d.coat,color:d.color,stage:stage(d),wear:d.wear||{},born:d.born}}
function pub(d){const r=Object.assign({},d);delete r.room;return r}
function applyPath(path,val,merge){
  const parts=path.split('/').filter(Boolean);
  if(!parts.length){if(merge){for(const k in val){if(val[k]===null)delete ROOM.data[k];else ROOM.data[k]=val[k]}}else ROOM.data=val||{};return}
  let o=ROOM.data;for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=='object'||o[parts[i]]===null)o[parts[i]]={};o=o[parts[i]]}
  const k=parts[parts.length-1];
  if(merge){if(typeof o[k]!=='object'||o[k]===null)o[k]={};for(const kk in val){if(val[kk]===null)delete o[k][kk];else o[k][kk]=val[kk]}}
  else{if(val===null)delete o[k];else o[k]=val}
}
function roomConnect(code){
  roomClose();if(!NET.ok())return;
  NET.init().then(()=>roomOpen(code)).catch(()=>{setTimeout(()=>{if(S&&S.room===code&&!ROOM)roomConnect(code)},15000)});
}
function roomOpen(code){
  if(ROOM)return;
  const es=new EventSource(NET.u('rooms/'+code));
  ROOM={code,es,data:{},live:false,hb:null};
  const on=merge=>e=>{try{const m=JSON.parse(e.data);applyPath(m.path,m.data,merge);onRoom()}catch(err){}};
  es.addEventListener('put',on(false));es.addEventListener('patch',on(true));
  es.onopen=()=>{if(ROOM){ROOM.live=true;redrawSheets()}};es.onerror=()=>{if(ROOM){ROOM.live=false;redrawSheets()}};
  heartbeat();ROOM.hb=setInterval(heartbeat,30000);
}

function heartbeat(){if(!ROOM||!S)return;NET.patch(`rooms/${ROOM.code}/players/${S.pid}`,{name:S.player||'Gracz',at:Date.now()}).catch(()=>{});publishProfile()}
function publishProfile(){if(ROOM&&S)NET.put(`rooms/${ROOM.code}/dogs/${S.pid}`,profile(D())).catch(()=>{})}
const pushT={};
function pushDog(d){if(!d.room||!ROOM||ROOM.code!==d.room)return;clearTimeout(pushT[d.id]);pushT[d.id]=setTimeout(()=>{NET.put(`rooms/${d.room}/shared/${d.id}`,pub(d)).catch(()=>{})},400)}
function onRoom(){
  if(!ROOM||!S)return;const data=ROOM.data,sh=data.shared||{};let changed=false;
  for(const id in sh){const r=sh[id];if(!r||!r.id)continue;let l=S.dogs.find(x=>x.id===id);
    if(!l){if(S.dogs.length>=MAX_DOGS+4)continue;S.dogs.push(Object.assign({},r,{room:ROOM.code,wear:r.wear||{},tricks:r.tricks||{}}));changed=true;
      toast(r.parents?`Urodził${r.sex==='f'?'a':''} się ${r.sex==='f'?'suczka':'piesek'} ${esc(r.name)}! Jest w Psiarni.`:`${esc(r.name)} jest teraz waszym wspólnym jamnikiem.`);if(r.parents)sfx('win')}
    else if((r.rev||0)>(l.rev||0)){Object.assign(l,r,{room:ROOM.code});if(!l.wear)l.wear={};if(!l.tricks)l.tricks={};changed=true}
    else if((l.rev||0)>(r.rev||0))pushDog(l)}
  const dt=data.date;
  if(dt&&dt.id){
    if(dt.status==='asked'&&dt.to===S.pid&&Date.now()-dt.at<6e5&&!askedSeen.has(dt.id)){askedSeen.add(dt.id);showInvite(dt)}
    if((dt.status==='accepted'||dt.status==='done')&&Date.now()-(dt.acceptedAt||0)<18e4&&!(S.seenDates||[]).includes(dt.id)&&(dt.from===S.pid||dt.to===S.pid)){

    if(dt.status==='declined'&&dt.from===S.pid&&!askedSeen.has('no'+dt.id)){askedSeen.add('no'+dt.id);toast(`${esc(dt.toName||'Druga osoba')} nie może teraz na randkę.`)}
    if(dt.status!=='asked'&&!$('#invite').hidden&&$('#invite').dataset.id===dt.id)hideInvite()}
  if(changed)save();
  renderHUD();redrawSheets();
}

  const st=cur(d);if(st.fun<40)return `${esc(d.name)} jest ${Gx(d,'smutny','smutna')}. Pobaw się najpierw.`;if(st.energy<20)return `${esc(d.name)} jest ${Gx(d,'zbyt zmęczony','zbyt zmęczona')}.`;

      t.add(new Node(geoRBox(.12,.08,TILE/2,.05),gm('#C9A36F',.0))).p=[s*2.45,-.02,0]}

  const dog=buildDog(d,{stage:stage(d),wear:d.wear});dog.root.r=[0,Math.PI/2,0];dog.A.move=5.5;dog.A.tongue=true;sc.add(dog.root);

    $('#rBack').onclick=()=>{fxStop();hideGame()}}
  $('#gGo').onclick=e=>{e.stopPropagation();$('#gm').hidden=true;running=true};
  gameCleanup=()=>{if(running)finish();else{fxStop();hideGame()}};
  watchClose(()=>{window.removeEventListener('keydown',key);fxStop()});
}

    if(kind==='gold'){n=coinNode();n.mat=gm('#FFB300',.02,{shiny:true});n.s=[.4,.4,.1]}
    if(kind==='bone')n=boneNode();
    if(kind==='meat'){n=new Node();const a=n.add(new Node(GS,gm('#D9475B')));a.s=[.28,.22,.22];const b=n.add(new Node(geoCapsule(.05,.25),gm('#FFF6E6')));b.p=[.3,0,0]}
    if(kind==='choc'){n=new Node(geoRBox(.3,.2,.08,.04),gm('#5A3420',.02,{pat:6,pc:hex3('#4A2A18'),ps:6}))}
    if(kind==='onion'){n=new Node();const a=n.add(new Node(GS,gm('#B565C9')));a.s=[.26,.26,.26];const b=n.add(new Node(geoCapsule(.04,.18),gm('#6DC071')));b.p=[0,.3,0];b.r=[0,0,Math.PI/2]}
    return n}
  const cam={eye:[0,3,8.2],target:[0,1.45,0],fov:30,width:5.8,minAsp:.1};
  const mv=e=>{const r=wrap.getBoundingClientRect();tx=clamp(((e.clientX-r.left)/r.width-.5)*7.2,-3,3)};
  wrap.addEventListener('pointerdown',mv);wrap.addEventListener('pointermove',mv);
  fxMount(wrap,sc,cam,dt=>{
    if(running){
      t+=dt;next-=dt;
      if(next<=0){next=Math.max(.3,.65-t*.008);let r=Math.random()*TOT,kd=KINDS[0];for(const q of KINDS){if((r-=q.p)<0){kd=q;break}}
        const n=mk(kd.k);n.p=[(Math.random()-.5)*5.6,7.5,headZ];sc.add(n);items.push({n,kd,vy:-(2.5+Math.random()*1.5+t*.06)})}
      const old=x;x+=(tx-x)*Math.min(1,dt*9);const vx=(x-old)/Math.max(dt,1e-3);
      for(const it of items){it.vy-=4*dt;it.n.p[1]+=it.vy*dt;it.n.r[1]+=dt*3;it.n.r[2]+=dt*2;
        if(!it.gone&&Math.abs(it.n.p[0]-x)<.6&&it.n.p[1]<headY+.45&&it.n.p[1]>headY-.7){it.gone=1;
          const sp=FX.eng.project(cam,[x,headY+.5,headZ]);
          if(it.kd.bad){hp--;flash=1;sfx('bad');floatAtFx('Fuj!',sp[0],sp[1]);dog.A.trick={name:'shake',t:0,dur:.6};if(navigator.vibrate)navigator.vibrate(90)}
          else{coins+=it.kd.v;sfx('coin');floatAtFx('+'+it.kd.v,sp[0],sp[1]);dog.A.eat=.4}}}
      items=items.filter(it=>{if(it.gone||it.n.p[1]<-.5){sc.remove(it.n);return false}return true});
      dog.A.move=Math.min(4,Math.abs(vx)*.7);
      $('#gC').textContent=coins;$('#gH').textContent=hearts(hp);$('#gT').textContent=Math.max(0,Math.ceil(45-t))+' s';
      if(hp<=0||t>=45)finish();
    }
    dog.root.p=[x,0,0];dog.root.r=[0,-Math.PI/2+clamp((tx-x)*-.5,-.6,.6),0];dog.update(dt);
  });
  FX.env=outdoorEnv();
  function finish(){if(done)return;done=true;running=false;
    S.coins+=coins;const rec=coins>(S.best.catch||0);S.best.catch=Math.max(S.best.catch||0,coins);const kk=Math.min(1,t/15);
    bump(d,{fun:Math.round(15*kk),energy:-Math.round(8*kk),food:Math.round(5*kk)});addXP(Math.round(12*kk));if(t>10)quest('game');save();
    showResult(hp>0?'Brawo!':'Koniec gry',coins,[`Radość +${Math.round(15*kk)}`,rec?'Nowy rekord!':`Rekord: ${S.best.catch} monet`]);
    $('#rBack').onclick=()=>{fxStop();hideGame()}}
  $('#gGo').onclick=e=>{e.stopPropagation();$('#gm').hidden=true;running=true};
  gameCleanup=()=>{if(running)finish();else{fxStop();hideGame()}};
  watchClose(()=>fxStop());
}

</script>

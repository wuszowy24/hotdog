<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My hotdog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  color-scheme:light;
  --ink:#3A2A4D;--surface:#FFFFFF;--surface2:#FFF7EE;--text:#3A2A4D;--muted:#6F6385;--track:#EDE7F3;--bg:#F6C7A8;
  --accent:#F5B53F;--pink:#F59BBE;--blue:#7CC6F0;--green:#8FD48A;--lilac:#C7B4F2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--surface:#2B2542;--surface2:#352E50;--text:#F4EEFF;--muted:#B9AED0;--track:#433B60;--bg:#1F1A30}
}
:root[data-theme="dark"]{color-scheme:dark;--surface:#2B2542;--surface2:#352E50;--text:#F4EEFF;--muted:#B9AED0;--track:#433B60;--bg:#1F1A30}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#stage{position:fixed;inset:0;touch-action:none;transition:opacity .18s}
#stage.fade{opacity:0}
#ui{position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 8px);max-width:520px;margin:0 auto}
#ui>*{pointer-events:auto}

.chip{display:flex;align-items:center;gap:6px;background:var(--surface);color:var(--text);border:3px solid var(--ink);border-radius:999px;padding:2px 11px;font-weight:700;min-height:40px;box-shadow:0 3px 0 var(--ink)}
.rb{width:42px;height:42px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--surface);color:var(--text);font-size:1.15rem;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink);position:relative}
.rb:active,.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#E0485E;color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--ink);padding:0 3px}
.badge.on{background:#5CBF6C}
.top{display:flex;flex-direction:column;gap:8px}
.row1{display:flex;align-items:center;gap:7px}
.namechip{flex:1;min-width:0;justify-content:space-between;padding:2px 4px}
.namechip .nm{flex:1;min-width:0;text-align:center;line-height:1.05;background:none;border:0;padding:0}
.namechip .nm b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namechip .nm small{display:block;font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namechip .sw{width:30px;height:30px;border:0;background:none;font-size:1.3rem;font-weight:800;color:var(--text);padding:0}
.sex{font-weight:800}.sex.m{color:#3D8BE0}.sex.f{color:#E0558E}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:#F7C948;border:2px solid #3A2A4D;box-shadow:inset 0 0 0 2px #FFE38A;vertical-align:-.12em;flex:none}
.coin.s{width:.85em;height:.85em;border-width:1.5px}
.meters{display:flex;justify-content:center;gap:12px}
.meter{position:relative;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
  background:conic-gradient(var(--col) calc(var(--v)*1%),rgba(58,42,77,.16) 0);display:grid;place-items:center;transition:--v .5s}
.meter span{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:1.25rem;border:2px solid var(--ink)}
.meter.low{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.lvl small{color:var(--muted);font-weight:700}
.xpbar{display:block;width:30px;height:8px;border-radius:6px;background:var(--track);overflow:hidden;border:2px solid var(--ink)}
.xpbar i{display:block;height:100%;background:#A889F0;width:0}

.side{position:absolute;right:10px;top:42%;display:flex;flex-direction:column;gap:10px;transform:translateY(-50%)}
.bottom{display:flex;flex-direction:column;gap:8px}
.tray{background:var(--surface);color:var(--text);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);padding:8px;min-height:74px}
.tray .ttl{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:1rem;margin:0 4px 4px}
.tray .ttl small{font-weight:600;color:var(--muted);font-size:.8rem}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;touch-action:pan-x}
.strip::-webkit-scrollbar{display:none}
.it{flex:none;width:76px;border:3px solid var(--ink);border-radius:18px;background:var(--surface2);color:var(--text);padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 3px 0 var(--ink);position:relative;touch-action:pan-x}
.it .em{font-size:1.9rem;line-height:1.15}
.it .nm{font-size:.68rem;font-weight:700;line-height:1.05;text-align:center;min-height:2.1em;display:flex;align-items:center}
.it .pr{font-size:.75rem;font-weight:800;display:flex;align-items:center;gap:3px}
.it .cnt{position:absolute;top:-6px;right:-6px;background:#3A2A4D;color:#fff;border-radius:10px;font-size:.7rem;font-weight:800;padding:0 6px;border:2px solid #fff}
.it.on{background:#C9F0C4}
.it.lock{opacity:.55}
.it:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ab{flex:1;min-width:0;border:3px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink);color:#3A2A4D;font-weight:800;padding:6px 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.98rem;min-height:48px;background:var(--accent)}
.ab .em{font-size:1.35rem}
.ab:disabled{opacity:.45}
.ab:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ab.b{background:var(--blue)}.ab.g{background:var(--green)}.ab.p{background:var(--pink)}.ab.l{background:var(--lilac)}.ab.w{background:var(--surface2);color:var(--text)}
.trk{flex:1 1 22%;flex-direction:column;gap:0;padding:4px 4px 6px;min-height:58px;font-size:.82rem;background:var(--surface2);color:var(--text)}
.trk .em{font-size:1.25rem}
.trk .mb{width:86%;height:6px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:2px}
.trk .mb i{display:block;height:100%;background:#A889F0}
.trk.lock{opacity:.5}
.prog{height:12px;border-radius:8px;background:var(--track);border:2.5px solid var(--ink);overflow:hidden;margin:4px 2px 8px}
.prog i{display:block;height:100%;background:#4FB3EA;width:0;transition:width .2s}
.hint{font-size:.85rem;color:var(--muted);font-weight:600;margin:2px 4px 6px;line-height:1.25}
.dock{display:flex;justify-content:space-between;gap:4px;background:var(--surface);border:3px solid var(--ink);border-radius:22px;padding:5px;box-shadow:0 4px 0 var(--ink)}
.dock button{flex:1;border:0;border-radius:16px;background:none;padding:3px 0 1px;display:flex;flex-direction:column;align-items:center;font-size:.66rem;font-weight:700;color:var(--muted);line-height:1.1}
.dock button .em{font-size:1.35rem;line-height:1.2;transition:transform .15s}
.dock button.on{background:var(--accent);color:#3A2A4D}
.dock button.on .em{transform:scale(1.15)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.float{position:absolute;font-weight:800;font-size:1.5rem;animation:floatUp 1.2s ease-out forwards;white-space:nowrap;color:#3A2A4D;text-shadow:0 2px 0 #fff,0 -1px 0 #fff;transform:translate(-50%,-50%)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-50%) scale(.8)}20%{transform:translate(-50%,-70%) scale(1.1)}to{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.need{position:absolute;background:var(--surface);border:3px solid var(--ink);border-radius:18px;padding:0 9px;font-size:1.5rem;box-shadow:0 3px 0 var(--ink);transform:translate(-50%,-100%);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{margin-top:-5px}}
.shower{position:absolute;width:150px;height:260px;transform:translate(-50%,-100%);background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(79,179,234,.6) 10px 13px);background-size:100% 40px;animation:rain .3s linear infinite;border-radius:40px 40px 0 0;opacity:.9}
@keyframes rain{from{background-position:0 0}to{background-position:0 40px}}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);transform:translateX(-50%);background:#3A2A4D;color:#fff;border-radius:16px;padding:7px 16px;font-weight:600;z-index:90;max-width:min(90vw,440px);text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:tin .2s ease-out;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

.sheetwrap{position:fixed;inset:0;background:rgba(20,14,35,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--surface);color:var(--text);border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;-webkit-user-select:text;user-select:text}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.shead h2{margin:0;font-size:1.45rem;font-weight:800}
.btn{background:var(--accent);color:#3A2A4D;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:8px 16px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45}
.btn.big{width:100%;padding:12px 18px;font-size:1.15rem}
.btn.sm{padding:4px 10px;font-size:.9rem;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:var(--surface);color:var(--text)}
.btn.love{background:#F9B8D0}
.btn.ok{background:#A9E2A0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px dashed var(--track)}
.row:last-child{border-bottom:0}
.info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.info b{font-weight:700}
.info small{color:var(--muted);font-weight:500}
.group{margin:12px 0 2px;font-weight:800;font-size:1.05rem}
.note{margin:4px 0;color:var(--muted);font-weight:500;line-height:1.35}
.thumb{width:96px;height:76px;flex:none;object-fit:contain}
.setrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.setrow input{flex:1}
input[type=text]{font:inherit;font-weight:600;font-size:1.05rem;padding:8px 12px;border-radius:14px;border:3px solid var(--ink);background:var(--surface);color:var(--text);min-width:0;width:100%}
.roomcode{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFF1C2;color:#3A2A4D;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:700}
.roomcode b{font-size:1.8rem;letter-spacing:.12em;font-weight:800}
.online{display:inline-block;width:10px;height:10px;border-radius:50%;background:#B9AED0;margin-right:5px;vertical-align:1px}
.online.on{background:#5CBF6C}
.loveh{font-size:1.4rem;letter-spacing:.1em;margin:4px 0}
.qbar{height:10px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:3px}
.qbar i{display:block;height:100%;background:#5CBF6C}
.gamecard{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:12px;margin:8px 0;background:var(--surface);color:var(--text);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink)}
.gamecard .gi{font-size:2.2rem}
.gamecard b{display:block;font-size:1.15rem}
.gamecard small{color:var(--muted);font-weight:500;line-height:1.25;display:block}

#game{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.gtop{display:flex;align-items:center;gap:10px;max-width:520px;width:100%;margin:0 auto 10px}
.gtop h2{margin:0;font-size:1.4rem;font-weight:800;flex:1}
.gbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;position:relative;max-width:520px;width:100%;margin:0 auto}
.ghud{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:1.1rem}
.ghud .gcoins{display:flex;align-items:center;gap:6px}
.cwrap{position:relative;flex:1;min-height:0;border:3px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 var(--ink);touch-action:none;background:#BFE6F7}
.cwrap canvas{display:block}
.gmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:rgba(255,255,255,.84);color:#3A2A4D}
.gmsg b{font-size:1.5rem;font-weight:800}
.gmsg span{max-width:30ch;font-weight:500;line-height:1.35}
.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,14,35,.45);z-index:5;padding:16px;border-radius:24px}
.rcard{background:var(--surface);color:var(--text);border:3px solid var(--ink);border-radius:24px;padding:18px;width:min(100%,340px);text-align:center;box-shadow:0 5px 0 var(--ink);animation:up .25s ease-out}
.rcard h3{margin:0 0 6px;font-size:1.5rem;font-weight:800}
.rcard p{margin:4px 0;font-weight:600}
.rcard .big-coins{font-size:2rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}
.rcard .btn{margin-top:12px}
.rcard img{width:80%;max-width:240px}
#invite{position:fixed;inset:0;z-index:70}
#invite .result{position:fixed;border-radius:0}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;align-content:center}
.card{position:relative;aspect-ratio:1/1.05;border:3px solid var(--ink);border-radius:18px;background:#D3C2F5;box-shadow:0 4px 0 var(--ink);font-size:clamp(28px,10vw,44px);perspective:600px}
.card .front,.card .back{position:absolute;inset:0;display:grid;place-items:center;border-radius:15px;backface-visibility:hidden;transition:transform .3s}
.card .front{background:#FFF8EC;transform:rotateY(180deg)}
.card .back{background:#D3C2F5;color:#3A2A4D}
.card.up .front{transform:rotateY(0)}
.card.up .back{transform:rotateY(-180deg)}
.card.done{box-shadow:0 4px 0 #5CBF6C;border-color:#3E9A4F}
.fxwrap{position:relative;flex:1;min-height:260px;border:3px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.fxwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hz{position:absolute;inset:0;pointer-events:none}
.hz span{position:absolute;font-size:1.7rem;animation:floatUp 1.6s ease-out forwards}
.bigheart{position:absolute;left:50%;top:22%;font-size:3.4rem;transform:translate(-50%,0) scale(0);animation:hpop .6s 3.2s ease-out forwards;pointer-events:none}
@keyframes hpop{to{transform:translate(-50%,0) scale(1)}}

#adopt{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
.adopt{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.adopt .brand{font-size:2.8rem;font-weight:800;line-height:1;letter-spacing:-.01em;color:#3A2A4D}
.adopt h1{margin:0;font-size:1.4rem;font-weight:800;line-height:1.1;color:#3A2A4D}
.adopt .apv{height:230px;flex:none;background:radial-gradient(ellipse at 50% 85%,#FFE7C9 0 45%,#F8D3B4 46%)}
.field .lbl{display:block;font-weight:800;margin-bottom:6px;font-size:1.05rem;color:#3A2A4D}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:3px solid var(--ink);border-radius:14px;padding:5px 12px;background:var(--surface);color:var(--text);font-weight:600;display:inline-flex;align-items:center;gap:7px;box-shadow:0 3px 0 var(--ink)}
.opt[aria-pressed="true"]{background:var(--accent);color:#3A2A4D}
.sw2{width:18px;height:18px;border-radius:50%;border:2px solid #3A2A4D;flex:none}
.err{padding:30px;text-align:center;font-weight:700}
@media (max-height:700px){.meter{width:44px;height:44px}.meter span{width:32px;height:32px;font-size:1.05rem}.it{width:68px}.it .em{font-size:1.6rem}.ab{min-height:42px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui" hidden>
  <header class="top">
    <div class="row1">
      <button class="rb" id="bSet" aria-label="Ustawienia">⚙️</button>
      <div class="chip namechip"><button class="sw" id="prevDog" aria-label="Poprzedni jamnik">‹</button><button class="nm" id="nameBtn"><b id="dogName"></b><small id="dogSub"></small></button><button class="sw" id="nextDog" aria-label="Następny jamnik">›</button></div>
      <div class="chip"><span class="coin"></span><b id="coins">0</b></div>
    </div>
    <div class="row1">
      <div class="chip lvl"><small>Więź</small><b id="lvl">1</b><span class="xpbar"><i id="xp"></i></span></div>
      <div class="meters" style="flex:1">
        <div class="meter" data-k="food" style="--col:#F5A93B"><span>🍖</span></div>
        <div class="meter" data-k="clean" style="--col:#4FB3EA"><span>🫧</span></div>
        <div class="meter" data-k="fun" style="--col:#EF6F9A"><span>💗</span></div>
        <div class="meter" data-k="energy" style="--col:#5CBF6C"><span>⚡</span></div>
      </div>
    </div>
  </header>
  <div class="side" id="side">
    <button class="rb" id="bQuest" aria-label="Zadania dnia">📜<i class="badge" id="qBadge" hidden></i></button>
    <button class="rb" id="bDuo" aria-label="Razem">💞<i class="badge" id="duoBadge" hidden></i></button>
    <button class="rb" id="bKennel" aria-label="Psiarnia">🏠</button>
  </div>
  <footer class="bottom">
    <div class="tray" id="tray"></div>
    <nav class="dock" id="dock"></nav>
  </footer>
</div>
<div id="fx"></div>
<div id="adopt" hidden></div>
<div id="game" hidden></div>
<div id="sheet" hidden></div>
<div id="invite" hidden></div>
<div id="toastHost"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const KEY='my_hotdog_v2',OLDKEY='moj_jamnik_v1';
const CFG=window.MYHOTDOG_CONFIG||{};

/* ---- Ustawienia gry ---- */
const GROW_H={young:24,adult:72};       // godziny: szczeniak -> młody -> dorosły
const DATES_FOR_PUPPY=3;                // ile randek do szczeniaka
const DATE_COOLDOWN_MIN=20;             // przerwa między randkami (minuty)
const MAX_DOGS=8, EXTRA_DOG_PRICE=150;

const COATS={smooth:'Krótkowłosy',long:'Długowłosy',wire:'Szorstkowłosy'};
const COLORS={
  red:{n:'Rudy',base:'#C4622D'},
  bt:{n:'Czarny podpalany',base:'#2C2426',tan:'#C9793A'},
  ct:{n:'Czekoladowy podpalany',base:'#5E3622',tan:'#D39A5E'},
  cream:{n:'Kremowy',base:'#EBC995'},
  merle:{n:'Merle (dapple)',base:'#A9ADB8',tan:'#C9793A',patches:'#2E292C',blueEye:true},
  piebald:{n:'Srokaty',base:'#B9592A',white:true},
  brindle:{n:'Pręgowany',base:'#B9652F',stripes:'#3A2418'},
  boar:{n:'Dzikowaty',base:'#6A5546',tan:'#B88A5E',grizzle:true}

    const x=-Math.cos(ph)*Math.sin(th),y=Math.cos(th),z=Math.sin(ph)*Math.sin(th);p.push(x,y,z);n.push(x,y,z)}}

    const u=(ax+1)%3,v=(ax+2)%3,su=S[u],sv=S[v],base=p.length/3;

// ray vs list of pickables [{node,rad:[a,b,c]}]
function pickRay(ray,list){
  let best=null;
  for(const it of list){
    if(!it.node.visible)continue;let hidden=false;for(let p=it.node.parent;p;p=p.parent)if(!p.visible)hidden=true;if(hidden)continue;
    const inv=M4.invert(it.node.world);const lo=M4.xf(inv,ray.o),ld=M4.xd(inv,ray.d);
    const o=[lo[0]/it.rad[0],lo[1]/it.rad[1],lo[2]/it.rad[2]],d=[ld[0]/it.rad[0],ld[1]/it.rad[1],ld[2]/it.rad[2]];
    const a=V3.dot(d,d),b=2*V3.dot(o,d),c=V3.dot(o,o)-1,disc=b*b-4*a*c;if(disc<0)continue;
    const t=(-b-Math.sqrt(disc))/(2*a);if(t<0)continue;
    if(!best||t<best.t)best={t,p:V3.add(ray.o,V3.mul(ray.d,t)),it};
  }
  return best;
}

const DOGP={

  pup:{k:.62,BR:.42,BL:.6,bodyY:.6,LR:.13,h:.52,SL:.2,srK:.42,ER:.175,EW:.23,EL:.4,TL:.3,TR:.095,headUp:1.05,headFw:.52}

const SAFE_COLORS={red:1,bt:1,ct:1,cream:1,merle:1,piebald:1,brindle:1,boar:1};

function buildDog(d,o){
  o=o||{};
  const st=o.stage||'adult',P=DOGP[st],C=COLORS[d.color]||COLORS.red;
  const long=d.coat==='long',wire=d.coat==='wire';
  const root=new Node(),rig=root.add(new Node());rig.sc(P.k);rig.ow=Math.max(.75,P.k);
  const W=(st==='pup'?{}:(o.wear||{}));
  const mats=[],pick=[];
  const OL=.024;
  const dm=(c,extra)=>{const m=mat(c,OL,Object.assign({space:rig},extra||{}));mats.push(m);return m};
  // fur material (base with pattern)
  const furExtra={};
  if(C.patches)Object.assign(furExtra,{pat:1,pc:hex3(C.patches),ps:3.4,seed:3});
  if(C.stripes)Object.assign(furExtra,{pat:2,pc:hex3(C.stripes),ps:24});
  if(C.white)Object.assign(furExtra,{pat:3,pc:hex3('#FFF6EC'),ps:1.9,seed:7});
  if(C.grizzle)Object.assign(furExtra,{pat:5,pc:hex3(shade(C.base,-0.45)),ps:P.bodyY+P.BR*.45});
  const fur=dm(C.base,furExtra);
  const tanC=C.tan||(C.white?'#FFF6EC':null);
  const legM=dm(C.base,Object.assign({},furExtra,tanC?{sy:P.LR*2.6,sc:hex3(tanC)}:{}));
  const snoutM=dm(C.base,Object.assign({},furExtra,C.tan?{sy:0,sc:hex3(C.tan)}:{}));
  const earM=dm(shade(C.base,-0.12),C.patches?{pat:1,pc:hex3(C.patches),ps:3.4,seed:3}:{});
  const ink=mat('#2A2030',OL,{shiny:true});
  const white=mat('#FFFFFF',OL);
  const S=geoSphere();
  const add=(par,geo,m,p,s,r,rad)=>{const n=par.add(new Node(geo,m));n.p=p;if(s)n.s=s;if(r)n.r=r;if(rad)pick.push({node:n,rad});return n};
  const{BR,BL,bodyY,LR,h,SL,ER}=P;

  // shadow
  const sh=rig.add(new Node(S,{c:[0,0,0],o:0,unlit:true,alpha:.18}));sh.p=[0,.01,0];sh.s=[BL*.5+BR*1.3,.004,BR*1.5];

  const body=rig.add(new Node());body.p=[0,bodyY,0];
  add(body,geoCapsule(BR,BL),fur,[0,0,0],null,null,[BR+BL/2,BR,BR]);
  // chest
  if(tanC)add(body,S,dm(tanC),[BL/2+BR*.42,-BR*.12,0],[BR*.42,BR*.62,BR*.66]);
  // belly fringe (long)
  if(long)for(let i=0;i<6;i++){const x=-BL/2+BL*(i+.5)/6;add(body,S,fur,[x,-BR*.86,0],[BR*.32,BR*.22,BR*.62],[0,0,(i%2?.25:-.25)])}
  // wire back tufts
  if(wire)for(let i=0;i<7;i++){const x=-BL/2+BL*(i+.5)/7;add(body,S,fur,[x,BR*.9,0],[BR*.16,BR*.2,BR*.16],[0,0,-.4])}
  // clothes
  if(W.body==='sweater')add(body,geoCapsule(BR*1.07,BL*.62),dm('#D9475B',{pat:6,pc:hex3('#FFF0F0'),ps:7}),[0,0,0]);
  if(W.body==='raincoat'){add(body,geoCapsule(BR*1.07,BL*.66),dm('#F4C430'),[0,0,0]);for(const x of[-.2,.15])add(body,S,dm('#3A2A4D'),[x,BR*.25,BR*1.04],[.045,.045,.02])}

  // legs
  const hipY=-BR*.3,legLen=bodyY+hipY;
  const legs=[];
  for(const[lx,lz,front]of[[BL/2*.86,BR*.52,1],[BL/2*.86,-BR*.52,1],[-BL/2*.86,BR*.52,0],[-BL/2*.86,-BR*.52,0]]){
    const pv=body.add(new Node());pv.p=[lx,hipY,lz];pv.front=front;pv.side=lz>0?1:-1;
    const L=Math.max(.01,legLen-LR);

    add(pv,S,legM,[LR*.5,-(legLen-LR*.72),0],[LR*1.5,LR*.75,LR*1.15]);

  }

  add(tail,geoCapsule(P.TR,P.TL,.35),fur,[-P.TL/2-P.TR*.3,0,0],null,null,[P.TL/2+P.TR,P.TR,P.TR]);
  if(long)add(tail,S,fur,[-P.TL*.55,-P.TR*1.3,0],[P.TL*.5,P.TR*1.7,P.TR*1.1],[0,0,.15]);

    add(neck,geoCapsule(BR*.6,len*.8),fur,[A[0]+dx/2,A[1]+dy/2,0],null,[0,0,Math.atan2(dy,dx)])}
  const head=neck.add(new Node());head.p=[H[0],H[1],0];
  add(head,S,fur,[0,0,0],[h*1.05,h*.95,h*.94],null,[h*1.05,h*.95,h*.94]);
  const sr=h*P.srK;
  const snout=add(head,geoCapsule(sr,SL),snoutM,[h*.55+SL/2,-h*.24,0],[1,.92,1],[0,0,-.08],[SL/2+sr,sr,sr]);

  // beard (wire)
  if(wire){const bc=C.tan||shade(C.base,.25);add(head,S,dm(bc),[h*.6+SL*.7,-h*.24-sr*.75,0],[SL*.55,sr*.55,sr*.75]);
    add(head,S,dm(bc),[h*.5+SL*.2,-h*.05,0],[SL*.45,sr*.3,sr*.95])}
  // eyes
  const eyes=[];
  for(const sd of[1,-1]){
    const e=head.add(new Node());e.p=[h*.48,h*.24,sd*h*.6];e.r=[0,sd*-.45,0];
    add(e,S,white,[0,0,0],[ER,ER*1.05,ER]);
    const iris=C.blueEye?mat('#6FB2E8',0):ink;
    add(e,S,iris,[ER*.42,ER*.04,sd*ER*.36],[ER*.72,ER*.8,ER*.72]);
    if(C.blueEye)add(e,S,ink,[ER*.62,ER*.04,sd*ER*.48],[ER*.42,ER*.5,ER*.42]);
    add(e,S,mat('#FFFFFF',0,{unlit:true}),[ER*.82,ER*.36,sd*ER*.5],[ER*.22,ER*.22,ER*.22]);
    if(st==='pup')add(e,S,mat('#FFFFFF',0,{unlit:true}),[ER*.9,-ER*.22,sd*ER*.36],[ER*.11,ER*.11,ER*.11]);
    if(d.sex==='f')for(let k=0;k<3;k++){const l=e.add(new Node(geoCapsule(ER*.09,ER*.42),ink));l.p=[ER*(.15+k*.32),ER*(.98-k*.08),sd*ER*.3];l.r=[0,0,1.1-k*.35]}
    eyes.push(e);
    // brows
    const brow=head.add(new Node(S,dm(C.tan||shade(C.base,wire?.2:-.25))));brow.p=[h*.5,h*.56,sd*h*.5];brow.s=wire?[h*.2,h*.1,h*.16]:[h*.13,h*.06,h*.1];brow.side=sd;
    brow.base=!!(C.tan||wire);brow.visible=brow.base;
    e.brow=brow;
    if(st==='pup')add(head,S,mat('#F4A0B4',0),[h*.6,-h*.12,sd*h*.66],[h*.16,h*.1,h*.08]);
  }
  // ears
  const ears=[];
  for(const sd of[1,-1]){
    const ep=head.add(new Node());ep.p=[-h*.15,h*.5,sd*h*.78];ep.side=sd;
    const EL=P.EL*(long?1.35:1);
    add(ep,S,earM,[0,-EL*.85,sd*.03],[P.EW*(long?1.15:1),EL,.075],null,[P.EW,EL,.1]);
    if(long)for(let i=0;i<3;i++)add(ep,S,earM,[(i-1)*P.EW*.6,-EL*1.72,sd*.03],[P.EW*.35,P.EW*.45,.07]);
    ears.push(ep);
  }
  // collar
  const col=ITEMS.find(i=>i.id===W.neck);
  if(col){const cr=head.parent===neck&&st!=='pup'?BR*.62:h*.7;
    const cn=neck.add(new Node(geoTorus(cr,.045),mat(col.c,OL)));
    const ang=Math.atan2(H[1],H[0]);cn.p=[H[0]*.42,H[1]*.42,0];cn.r=[0,0,ang-Math.PI/2];
    if(col.tag)add(cn,S,mat('#F7D560',OL,{shiny:true}),[0,0,0],[.07,.07,.025]).p=[cr+.06,-.02,0];
  }
  // hats & glasses
  if(W.head==='cap'){const c=head.add(new Node());c.p=[-h*.05,h*.72,0];c.r=[0,0,.1];
    add(c,geoLathe('dome',[[0.0001,.55],[.35,.5],[.6,.32],[.72,.1],[.74,0]]),mat('#3D8BE0',OL),[0,0,0],[h*.95,h*.95,h*.95]);
    add(c,geoRBox(.5,.04,.55,.04),mat('#2C6FB8',OL),[h*.62,.0,0],[h*1,1,h*1.1])}
  if(W.head==='crown'){const c=head.add(new Node());c.p=[-h*.05,h*.86,0];
    add(c,geoLathe('crownb',[[.42,0],[.42,.18],[.4,.2]]),mat('#F2C230',OL,{shiny:true}),[0,0,0],[h*1.1,h*1.1,h*1.1]);
    for(let i=0;i<5;i++){const a=i/5*Math.PI*2;add(c,geoLathe('spike',[[.1,0],[.0001,.22]]),mat('#F2C230',OL),[Math.cos(a)*h*.42,h*.2,Math.sin(a)*h*.42],[h,h,h])}
    add(c,S,mat('#E04848',OL,{shiny:true}),[h*.46,h*.1,0],[h*.08,h*.08,h*.08])}
  if(W.head==='bow'){const c=head.add(new Node());c.p=[-h*.05,h*.82,h*.42];c.r=[.4,0,0];
    for(const sd of[1,-1])add(c,geoLathe('bowc',[[.0001,0],[.35,.45],[.0001,.5]]),mat('#F07AA8',OL),[sd*h*.02,0,0],[h*.55,h*.55,h*.55],[0,0,sd*Math.PI/2]);
    add(c,S,mat('#E0558E',OL),[0,0,0],[h*.12,h*.12,h*.12])}
  if(W.face==='shades'&&!o.sleep){const sm=mat('#22203A',OL*.7,{shiny:true});
    for(const sd of[1,-1]){const c=Math.cos(.45),sn=Math.sin(.45);add(head,geoRBox(.06,.5,.6,.05),sm,[h*.48+c*ER*1.15,h*.24,sd*(h*.6+sn*ER*1.15)],[ER*2.3,ER*2.3,ER*2.3],[0,sd*-.45,0])}
    add(head,geoCapsule(.028,h*.9),sm,[h*.72,h*.3,0],null,[0,Math.PI/2,0])}

      }
      // tail

      // head/neck
      let nz=Math.sin(t*1.3)*.04;
      if(A.mood==='sad')nz-=.12;
      if(A.sleep)nz=-.5;
      if(A.eat>0){A.eat=Math.max(0,A.eat-dt);nz=-.3}

      head.r=[Math.sin(t*.9)*.05+(A.sleep?.25:0),A.look*.35,A.sleep?-.15:Math.sin(t*1.1)*.05];

      tongue.visible=(happy&&A.tongue)||A.eat>0;

      for(const e of ears)e.r=[e.side*(A.mood==='sad'?.08:.22+(happy?Math.sin(t*13)*.04:0)),0,A.sleep?.4:(A.mood==='sad'?-.15:.12)];

    },

      if(nm==='shake'){rig.r[0]=Math.sin(t*40)*.18*e}
    }
  };

  return dog;
}

  moveDog(dt,d);
  dog.root.p=[M.pos[0],(R0().id==='bed'&&M.room.bedTop&&Math.hypot(M.pos[0],M.pos[2]-.25)<.9?M.room.bedTop:0),M.pos[2]];
  dog.root.r=[0,M.yaw,0];
  dog.update(dt);
  if(M.ball)updateBall(dt);
  if(M.rinsing>0){M.rinsing-=dt;for(const f of dog.foam.kids){f.s=f.s.map(v=>Math.max(0,v-dt*.25))}if(M.rinsing<=0){dog.foam.kids.length=0;finishRinse()}}
  const R=R0();if(R.id==='bed'&&M.room.lamp){const on=!d.sleeping;M.room.lamp.mat.unlit=on;M.room.lamp.mat.c=hex3(on?'#FFE27A':'#C9B66A')}
  M.eng.render(M.scene,M.cam,envFor());
  updateAnchors(d,st);
}
function moveDog(dt,d){
  const A=M.dog.A;
  const busy=d.sleeping||A.eat>0||A.trick||M.foam>0||M.rinsing>0||R0().id==='wardrobe'&&M.drag;
  let tgt=null,speed=1.1;
  if(M.fetch){tgt=M.fetch.goal;speed=2.4}
  else if(M.target)tgt=M.target.p;
  if(tgt&&!busy){
    const dx=tgt[0]-M.pos[0],dz=tgt[2]-M.pos[2],dist=Math.hypot(dx,dz);
    if(dist>.06){
      const want=Math.atan2(-dz,dx);M.yaw=lerpAng(M.yaw,want,Math.min(1,dt*8));
      const step=Math.min(dist,speed*dt*(stage(d)==='pup'?.75:1));M.pos[0]+=dx/dist*step;M.pos[2]+=dz/dist*step;
      A.walking=true;A.speed=speed>2?20:12;return;
    }
    A.walking=false;
    if(M.fetch){fetchArrive();return}
    if(M.target){const cb=M.target.cb;M.target=null;M.idle=4+Math.random()*5;if(cb)cb();}
  }else{
    A.walking=false;
    if(!busy&&!M.fetch){
      M.yaw=lerpAng(M.yaw,-.55+Math.sin(M.t*.4)*.08,Math.min(1,dt*2.5));
      M.idle-=dt;
      if(M.idle<=0&&!['bed','bath','wardrobe'].includes(R0().id)){M.idle=6+Math.random()*7;M.target={p:[(Math.random()-.5)*2.6,0,-.2+Math.random()*1.1]}}
    }
  }
}
function lerpAng(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t}
function goTo(p,cb){M.target={p,cb};M.idle=99}
function updateAnchors(d,st){

/* ---- wejście dotykiem ---- */
function setupInput(){
  const cv=$('#stage');let st=null;
  const pt=e=>[e.clientX,e.clientY];
  cv.addEventListener('pointerdown',e=>{
    if(!S||!M.dog)return;
    const[x,y]=pt(e),hit=pickRay(M.eng.ray(M.cam,x,y),M.dog.pick);
    st={x,y,hit:!!hit,moved:false,t:performance.now(),lastFoam:null};
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(R0().id==='bath'&&hit)rub(hit,st);
    if(R0().id==='wardrobe'){M.drag=true}
  });
  cv.addEventListener('pointermove',e=>{
    if(!st)return;const[x,y]=pt(e);
    if(Math.hypot(x-st.x,y-st.y)>10)st.moved=true;
    if(R0().id==='bath'){const hit=pickRay(M.eng.ray(M.cam,x,y),M.dog.pick);if(hit)rub(hit,st)}
    if(R0().id==='wardrobe'&&st.moved){M.yaw+=(x-(st.lx||st.x))*.012;st.lx=x}
  });
  const end=e=>{
    if(!st)return;const[x,y]=pt(e),dx=x-st.x,dy=y-st.y;M.drag=false;
    if(!st.moved&&st.hit&&R0().id!=='bath')pet(x,y);
    else if(!st.moved&&!st.hit&&R0().id==='play')throwBall(x,y);
    else if(st.moved&&R0().id!=='bath'&&R0().id!=='wardrobe'&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4)setRoom(M.roomIdx+(dx<0?1:-1));
    else if(st.moved&&R0().id==='play'&&dy<-60&&Math.abs(dy)>Math.abs(dx))throwBall(x,y);
    st=null;
  };
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',()=>{st=null;M.drag=false});
}

function rub(hit,st){
  const d=D();if(d.sleeping){sleepBlock();return}
  if(M.rinsing>0)return;
  if(st.lastFoam&&V3.len(V3.sub(hit.p,st.lastFoam))<.09)return;st.lastFoam=hit.p;
  const dog=M.dog;if(dog.foam.kids.length>=110)return;
  const inv=M4.invert(dog.rig.world),lp=M4.xf(inv,hit.p),k=dog.P.k;
  const f=dog.foam.add(new Node(geoSphere(),mat('#FFFFFF',.012,{shiny:true})));

}

/* ---- aport ---- */
function throwBall(x,y){
  const d=D();
  if(d.sleeping){sleepBlock();return}
  if(M.fetch||M.ball){toast('Piłka już leci!');return}
  if(cur(d).energy<5){toast(`${esc(d.name)} ${Gx(d,'jest zbyt zmęczony','jest zbyt zmęczona')}.`);return}
  const goal=[(Math.random()-.5)*3.4,0,-1.3+Math.random()*1.2];
  const ball=new Node(geoSphere(),mat('#E04848',.02,{pat:6,pc:hex3('#FFFFFF'),ps:4}));ball.s=[.17,.17,.17];
  M.scene.add(ball);M.ball={node:ball,from:[0,1.6,3.5],to:[goal[0],.17,goal[2]],t:0,dur:.75,state:'fly'};
  sfx('throw');M.fetch={goal:[goal[0]-.7*M.dog.P.k,0,goal[2]+.05],phase:'go'};M.target=null;
  const pr=M.room.kids.find(n=>n.geo&&n.mat&&n.mat.pat===6&&n.s[0]===.35);if(pr)pr.visible=false;
}
function updateBall(dt){
  const b=M.ball;
  if(b.state==='fly'){b.t+=dt;const k=Math.min(1,b.t/b.dur);
    b.node.p=[b.from[0]+(b.to[0]-b.from[0])*k,b.from[1]+(b.to[1]-b.from[1])*k+Math.sin(Math.PI*k)*1.6,b.from[2]+(b.to[2]-b.from[2])*k];
    b.node.r=[k*9,0,k*6];if(k>=1){b.state='rest';sfx('pop')}}
  if(b.state==='carry'){const p=M.dog.mouthWorld();b.node.p=[p[0],p[1]-.05,p[2]]}
}
function fetchArrive(){
  const F=M.fetch,d=D();
  if(F.phase==='go'){
    if(M.ball.state!=='rest'){return}
    M.ball.state='carry';F.phase='back';F.goal=[.2,0,1.0];sfx('pop');
  }else{
    M.ball.node.p=[M.pos[0]+1.3*M.dog.P.k*Math.cos(M.yaw),.17,M.pos[2]-1.3*M.dog.P.k*Math.sin(M.yaw)];M.ball.state='done';
    M.fetch=null;M.yaw=-.55;M.dog.A.bounce=1;bark(d);
    const h=M.anchors.head;if(h)floatAt('+2',h[0],h[1]-20);
    S.coins+=2;bump(d,{fun:6,energy:-3,food:-1});addXP(3);quest('fetch');sfx('coin');renderHUD();
    setTimeout(()=>{if(M.ball&&M.ball.state==='done'){M.scene.remove(M.ball.node);M.ball=null}},1600);
    M.idle=6;
  }
}

const FX={eng:null,canvas:null,scene:null,dogs:[],cam:null,run:null,last:0};
function fxMount(container,scene,cam,run){
  if(!FX.eng){FX.canvas=document.createElement('canvas');FX.eng=new Engine(FX.canvas,{fixed:true,alpha:true});requestAnimationFrame(fxLoop)}
  container.appendChild(FX.canvas);FX.scene=scene;FX.cam=cam;FX.run=run;FX.container=container;
}
function fxStop(){FX.run=null;FX.scene=null;if(FX.canvas&&FX.canvas.parentNode)FX.canvas.parentNode.removeChild(FX.canvas)}
function fxLoop(ts){
  requestAnimationFrame(fxLoop);const dt=Math.min(.05,(ts-FX.last)/1000||0);FX.last=ts;

const NET={
  base:null,
  cands(){const c=CFG.firebaseUrl;return(Array.isArray(c)?c:[c]).filter(u=>typeof u==='string'&&/^https?:\/\/[^/]+/.test(u)).map(u=>u.replace(/\/+$/,''))},
  ok(){return this.cands().length>0},
  async init(){
    if(this.base)return this.base;const cs=this.cands();
    if(cs.length===1){this.base=cs[0];return this.base}
    let saved=null;try{saved=localStorage.getItem('hotdog_db')}catch(e){}
    if(saved&&cs.includes(saved)){this.base=saved;return saved}
    for(const u of cs){try{const r=await fetch(u+'/rooms/PROBE1.json',{cache:'no-store'});if(r.ok){this.base=u;try{localStorage.setItem('hotdog_db',u)}catch(e){}return u}}catch(e){}}
    throw new Error('Nie mogę połączyć się z bazą Firebase.');
  },
  u(p){return(this.base||this.cands()[0])+'/'+p+'.json'},
  async req(m,p,v){await this.init();const r=await fetch(this.u(p),{method:m,headers:{'Content-Type':'application/json'},body:v===undefined?undefined:JSON.stringify(v)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()},
  get(p){return this.req('GET',p)},put(p,v){return this.req('PUT',p,v)},patch(p,v){return this.req('PATCH',p,v)},del(p){return this.req('DELETE',p)}
};
let ROOM=null;const askedSeen=new Set();

function pub(d){const r=Object.assign({},d);delete r.room;return r}
function applyPath(path,val,merge){
  const parts=path.split('/').filter(Boolean);
  if(!parts.length){if(merge){for(const k in val){if(val[k]===null)delete ROOM.data[k];else ROOM.data[k]=val[k]}}else ROOM.data=val||{};return}
  let o=ROOM.data;for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=='object'||o[parts[i]]===null)o[parts[i]]={};o=o[parts[i]]}
  const k=parts[parts.length-1];
  if(merge){if(typeof o[k]!=='object'||o[k]===null)o[k]={};for(const kk in val){if(val[kk]===null)delete o[k][kk];else o[k][kk]=val[kk]}}
  else{if(val===null)delete o[k];else o[k]=val}
}

  const dog={x:W/2-dw/2,y:H-dh-14,face:1};let tx=dog.x;
  fr.ready.then(f=>{F=f;dog.y=H-26-dh*F.y1+6;const g=$('#gGo');if(g)g.disabled=false});
  const KINDS=[{k:'coin',p:40,v:1},{k:'bone',e:'🦴',p:20,v:2},{k:'treat',e:'🍖',p:12,v:3},{k:'gold',p:5,v:5},{k:'choc',e:'🍫',p:12,bad:1},{k:'onion',e:'🧅',p:11,bad:1}];
  const TOT=KINDS.reduce((a,b)=>a+b.p,0);
  let items=[],t=0,next=0.4,coins=0,hp=3,running=false,raf=0,last=0,done=false,moving=0,flash=0;const pops=[];const DUR=45;
  function pick(){let r=Math.random()*TOT;for(const k of KINDS){if((r-=k.p)<0)return k}return KINDS[0]}
  function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#BFE6F7');g.addColorStop(.75,'#EAF7FF');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#6CC07A';ctx.fillRect(0,H-26,W,26);ctx.fillStyle=INK2;ctx.fillRect(0,H-26,W,3);
    for(const o of items){if(o.k==='coin')drawCoin(ctx,o.x,o.y,13);else if(o.k==='gold')drawCoin(ctx,o.x,o.y,16,true);else{ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.e,o.x,o.y)}}
    const img=imgs[moving>0.05?Math.floor(t*10)%2:0];ctx.save();if(dog.face<0){ctx.translate(dog.x+dw,0);ctx.scale(-1,1);ctx.drawImage(img,0,dog.y,dw,dh)}else ctx.drawImage(img,dog.x,dog.y,dw,dh);ctx.restore();
    ctx.font='bold 22px "Baloo 2",sans-serif';ctx.textAlign='center';for(const p of pops){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.bad?'#E0485E':INK2;ctx.fillText(p.s,p.x,p.y);ctx.globalAlpha=1}
    if(flash>0){ctx.fillStyle=`rgba(224,72,94,${flash*.35})`;ctx.fillRect(0,0,W,H)}}
  function loop2(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
    if(running){t+=dt;next-=dt;if(next<=0){next=Math.max(.26,.6-t*.007);const k=pick();items.push(Object.assign({},k,{x:24+Math.random()*(W-48),y:-20,vy:150+Math.random()*90+t*4}))}
      const dx=(tx-dog.x)*Math.min(1,dt*10);if(Math.abs(dx)>.4)dog.face=dx<0?-1:1;moving=Math.abs(dx);dog.x+=dx;
      const fx0=dog.face<0?1-F.x1:F.x0,box={x:dog.x+dw*fx0,y:dog.y+dh*F.y0-6,w:dw*(F.x1-F.x0),h:dh*(F.y1-F.y0)*.6};
      for(const o of items){o.y+=o.vy*dt;if(!o.gone&&hit2(box,{x:o.x-14,y:o.y-14,w:28,h:28})){o.gone=1;
        if(o.bad){hp--;flash=1;sfx('bad');pops.push({s:'Fuj!',x:o.x,y:o.y,l:1,bad:1});if(navigator.vibrate)navigator.vibrate(80)}else{coins+=o.v;sfx('coin');pops.push({s:'+'+o.v,x:o.x,y:o.y,l:1})}}}
      items=items.filter(o=>!o.gone&&o.y<H+30);for(const p of pops){p.y-=40*dt;p.l-=dt*1.4}while(pops.length&&pops[0].l<=0)pops.shift();if(flash>0)flash-=dt*2;
      $('#gC').textContent=coins;$('#gH').textContent=hearts(hp);$('#gT').textContent=Math.max(0,Math.ceil(DUR-t))+' s';
      if(hp<=0||t>=DUR){finish();return}}
    draw();raf=requestAnimationFrame(loop2)}
  function finish(){if(done)return;done=true;running=false;cancelAnimationFrame(raf);
    S.coins+=coins;const rec=coins>S.best.catch;S.best.catch=Math.max(S.best.catch,coins);const k=Math.min(1,t/15),fu=Math.round(15*k),en=Math.round(8*k);
    bump(d,{fun:fu,energy:-en,food:-Math.round(3*k)});addXP(Math.round(12*k));if(t>10)quest('game');save();draw();
    showResult(hp>0?'Brawo!':'Koniec gry',coins,[`Radość +${fu}, energia −${en}`,rec?'Nowy rekord!':`Rekord: ${S.best.catch} monet`])}
  const cw=$('#cw');const move=e=>{if(e.target.closest&&e.target.closest('button'))return;const r=cw.getBoundingClientRect();tx=clamp(e.clientX-r.left-dw/2,0,W-dw)};
  cw.addEventListener('pointerdown',move);cw.addEventListener('pointermove',move);
  $('#gGo').onclick=e=>{e.stopPropagation();$('#gm').hidden=true;running=true;last=performance.now()};
  gameCleanup=()=>{if(running)finish();else hideGame()};
  raf=requestAnimationFrame(ts=>{last=ts;loop2(ts)});watchClose(()=>cancelAnimationFrame(raf));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function startMemory(){
  if(!canPlay(5))return;const d=D();
  const deck=shuffle(['🦴','🎾','🥩','🧸','🥕','🌭','🦴','🎾','🥩','🧸','🥕','🌭']);
  openGame('Pary',`<div class="ghud"><span>Ruchy: <b id="mM">0</b></span><span>Pary: <b id="mP">0</b>/6</span></div>
    <div class="mgrid" id="mG">${deck.map((c,i)=>`<button class="card" data-i="${i}" aria-label="Karta ${i+1}"><span class="front">${c}</span><span class="back">🐾</span></button>`).join('')}</div>`);
  let open=[],moves=0,pairs=0,lock=false;gameCleanup=hideGame;
  $('#mG').onclick=e=>{const b=e.target.closest('.card');if(!b||lock||b.classList.contains('up'))return;
    b.classList.add('up');open.push(b);sfx('pop');if(open.length<2)return;moves++;$('#mM').textContent=moves;const[a,c]=open;
    if(deck[a.dataset.i]===deck[c.dataset.i]){a.classList.add('done');c.classList.add('done');open=[];pairs++;$('#mP').textContent=pairs;sfx('coin');
      if(pairs===6){const reward=clamp(34-2*(moves-6),6,30);S.coins+=reward;S.best.memory=S.best.memory?Math.min(S.best.memory,moves):moves;bump(d,{fun:12,energy:-3});addXP(10);quest('game');save();
        setTimeout(()=>showResult('Wszystkie pary!',reward,[`Ruchy: ${moves}. Mniej ruchów to więcej monet.`,'Radość +12']),500)}}
    else{lock=true;setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');open=[];lock=false},800)}};
}

/* ================= Start ================= */
window.hotdogBack=()=>{
  if(!$('#invite').hidden){$('#iNo')&&$('#iNo').click();return true}
  if(!$('#game').hidden){$('#gClose').click();return true}
  if(!$('#sheet').hidden){closeSheet();return true}
  if(!$('#adopt').hidden&&S){fxStop();$('#adopt').hidden=true;$('#adopt').innerHTML='';return true}
  if(M.roomIdx!==0){setRoom(0);return true}
  return false;
};
window.onHotdogUpdate=()=>{save();if($('#game').hidden&&$('#sheet').hidden&&$('#adopt').hidden)location.reload();else pendingReload=true};
function boot(){
  $('#tray').addEventListener('click',trayClick);
  $('#dock').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setRoom(+b.dataset.r)});
  $('#bSet').onclick=settingsSheet;$('#bQuest').onclick=questSheet;$('#bDuo').onclick=duoSheet;$('#bKennel').onclick=kennelSheet;$('#nameBtn').onclick=kennelSheet;
  $('#prevDog').onclick=()=>switchDog(-1);$('#nextDog').onclick=()=>switchDog(1);
  S=load();
  if(!S||!S.dogs||!S.dogs.length){showAdopt(false);return}
  S.best=S.best||{walk:0,catch:0,memory:0};S.owned=S.owned||[];S.inv=S.inv||{};S.seenDates=S.seenDates||[];if(!S.pid)S.pid=uid();
  for(const d of S.dogs){d.wear=d.wear||{};d.tricks=d.tricks||{};d.sex=d.sex||'m';d.stats=d.stats||{food:60,clean:60,fun:60,energy:60}}
  if(!S.dogs.some(d=>d.id===S.active))S.active=S.dogs[0].id;
  ensureQuests();
  $('#ui').hidden=false;if(!initMain())return;setRoom(S.roomIdx||0,true);renderHUD();
  if(S.daily!==today()){S.daily=today();S.coins+=20;setTimeout(()=>toast('Codzienna nagroda: +20 monet'),600);renderHUD()}
  save();if(S.room&&NET.ok())roomConnect(S.room);
}
fetch('version.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v)window.HOTDOG_VERSION=String(v.web)}).catch(()=>{});
setInterval(()=>{if(!S||!$('#adopt').hidden)return;if($('#game').hidden)renderHUD();if(S.quests&&S.quests.day!==today()){ensureQuests()}},1000);
setInterval(save,10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(S){renderHUD();if(ROOM)heartbeat()}});
boot();
